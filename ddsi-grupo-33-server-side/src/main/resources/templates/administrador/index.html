<html th:replace="~{layout/base-admin ::html}" xmlns:sec="http://www.w3.org/1999/xhtml">
<div th:fragment="contenido">
          <h1 class="mt-4 mb-4">Resumen del Sistema</h1>
          <p class="lead text-muted">
            Estadísticas y métricas clave del sistema MetaMapa.
          </p>

          <div class="row">
            <div class="col-md-6 col-lg-3">
              <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                  <h5 class="card-title fw-bold">Total de Hechos</h5>
                  <p class="card-text display-4" th:text="${totalHechos}"></p>
                </div>
              </div>
            </div>
            <div class="col-md-6 col-lg-3">
              <div class="card text-white bg-success mb-3">
                <div class="card-body">
                  <h5 class="card-title fw-bold">Total Colecciones</h5>
                  <p class="card-text display-4" th:text="${totalColecciones}"></p>
                </div>
              </div>
            </div>
            <div class="col-md-6 col-lg-3">
              <div class="card text-white bg-danger mb-3">
                <div class="card-body">
                  <h5 class="card-title fw-bold">Solicitudes de eliminación</h5>
                  <p class="card-text display-4" th:text="${totalSolicitudesDeEliminacion}"></p>
                </div>
              </div>
            </div>
            <div class="col-md-6 col-lg-3">
              <div class="card text-white bg-warning mb-3">
                <div class="card-body">
                  <h5 class="card-title fw-bold">Usuarios Registrados</h5>
                  <p class="card-text display-4" th:text="${totalUsuarios}"></p>
                </div>
              </div>
            </div>
          </div>

          <hr />

          <div class="row">
            <div class="col-lg-6">
              <div class="card mb-3">

                <div class="card-header fw-bold bg-dark text-white text-start">
                  Ultimos 10 Hechos
                </div>

                <table class="table table-stripped table-sm mb-0">

                  <tbody class="bg-dark text-white text-center">
                  <tr th:if="${todosLosHechos.size()}==0">
                    <td>No hay hechos para mostrar.</td>
                  </tr>
                  <tr th:each="hecho, iterStat : ${todosLosHechos}" th:if="${iterStat.index < 10}" class="text-muted">
                    <td th:text="${hecho.titulo}"></td>
                  </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="col-lg-6">
              <div class="card mb-3">

                <div class="card-header fw-bold bg-dark text-white text-start">
                  Ultimos 10 hechos (Semana del <span th:text="${rangoSemana}"></span>)
                </div>

                <table class="table table-stripped table-sm mb-0">

                  <tbody class="bg-dark text-white text-center">
                  <tr th:if="${hechosUltimaSemana.size()}==0">
                    <td>No hay hechos para mostrar.</td>
                  </tr>
                  <tr th:each="hecho, iterStat : ${hechosUltimaSemana}" th:if="${iterStat.index < 10}" class="text-muted">
                    <td th:text="${hecho.titulo}"></td>
                  </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
      </div>
</html>
