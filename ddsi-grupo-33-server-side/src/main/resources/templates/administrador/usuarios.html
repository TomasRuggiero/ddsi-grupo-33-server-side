<html th:replace="~{layout/base-admin ::html}" xmlns:sec="http://www.w3.org/1999/xhtml">
<div th:fragment="contenido">
            <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
                <h1>Gestión de Usuarios</h1>
            </div>

            <div class="accordion mb-4" id="filtersAccordion">
                <div class="accordion-item">
                    <h2 class="accordion-header" id="filtersHeading">
                        <button
                                class="accordion-button"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#filtersCollapse"
                                aria-expanded="true"
                                aria-controls="filtersCollapse"
                        >
                            <i class="bi bi-funnel me-2"></i> Filtros de búsqueda
                        </button>
                    </h2>
                    <div
                            id="filtersCollapse"
                            class="accordion-collapse collapse"
                            aria-labelledby="filtersHeading"
                            data-bs-parent="#filtersAccordion"
                    >
                        <div class="accordion-body">
                            <form class="row g-3" method="GET" action="/admin/usuarios">
                                <div class="col-md-6 col-lg-4">
                                    <label for="filtroNombre" class="form-label">Nombre</label>
                                    <input
                                            type="text"
                                            class="form-control"
                                            id="filtroNombre"
                                            name="nombre"
                                            th:value="${param.nombre}"
                                            placeholder="Ej: Juan Pérez"
                                    />
                                </div>

                                <div class="col-md-6 col-lg-4">
                                    <label for="filtroEmail" class="form-label">Correo electrónico</label>
                                    <input
                                            type="email"
                                            class="form-control"
                                            id="filtroEmail"
                                            name="correo"
                                            th:value="${param.correo}"
                                            placeholder="Ej: usuario@email.com"
                                    />
                                </div>

                                <div class="col-md-6 col-lg-4">
                                    <label for="filtroRol" class="form-label">Rol</label>
                                    <select class="form-select" id="filtroRol" name="rol">
                                        <option value="" th:selected="${param.rol == null or param.rol[0] == ''}">Todos</option>

                                        <option value="ADMIN" th:selected="${param.rol != null and param.rol[0] == 'ADMIN'}">
                                            Administrador
                                        </option>

                                        <option value="CONTRIBUYENTE" th:selected="${param.rol != null and param.rol[0] == 'CONTRIBUYENTE'}">
                                            Contribuyente
                                        </option>
                                    </select>
                                </div>

                                <div class="col-12 d-flex justify-content-end mt-3">
                                    <button type="submit" class="btn btn-primary me-2">
                                        <i class="bi bi-search"></i> Buscar
                                    </button>
                                    <a href="/admin/usuarios" class="btn btn-outline-secondary">
                                        <i class="bi bi-x-circle"></i> Limpiar Filtros
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>


            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white fw-bold">
                    Lista de Usuarios
                </div>

                <div class="table-responsive" style="max-height: 65vh; overflow-y: auto;">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr class="text-center">
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody class="text-center">
                        <tr th:if="${#lists.isEmpty(usuariosFiltrados)}">
                            <td colspan="4" class="text-muted">No se encontraron usuarios con esos filtros.</td>
                        </tr>

                        <tr th:each="usuario : ${usuariosFiltrados}">
                            <td th:text="${usuario.nombre}"></td>
                            <td th:text="${usuario.correo}"></td>
                            <td>
            <span th:classappend="${usuario.rol == 'ADMIN' ? 'bg-primary' : 'bg-secondary'}"
                  class="badge" th:text="${usuario.rol}"></span>
                            </td>
                            <td>
                                <button th:if="${usuario.rol != 'ADMIN'}"
                                        class="btn btn-sm btn-outline-primary me-1"
                                        th:onclick="|cambiarRol(${usuario.id}, 'promover')|">
                                    <i class="bi bi-arrow-up-circle me-1"></i> Promover
                                </button>

                                <button class="btn btn-sm btn-outline-danger"
                                        data-bs-toggle="modal"
                                        data-bs-target="#modalConfirmarEliminacion"
                                        th:data-id="${usuario.id}"
                                        th:data-nombre="${usuario.nombre}">
                                    <i class="bi bi-trash me-1"></i> Eliminar
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
    </div>

<div
        class="modal fade"
        id="modalConfirmarEliminacion"
        tabindex="-1"
        aria-labelledby="modalConfirmarEliminacionLabel"
        aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header">
                <h5 class="modal-title" id="modalConfirmarEliminacionLabel">
                    Confirmar eliminación
                </h5>
                <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                ></button>
            </div>
            <div class="modal-body">
                ¿Estás seguro de que deseas eliminar este usuario?
                Esta acción no se puede deshacer.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
            </div>
        </div>
    </div>
</div>

    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script th:inline="javascript">
        let idUsuarioAEliminar = null;

        // 1. Lógica para preparar el Modal de Eliminación
        const modalEliminar = document.getElementById('modalConfirmarEliminacion');
        modalEliminar.addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;
            idUsuarioAEliminar = button.getAttribute('data-id');
            const nombre = button.getAttribute('data-nombre');

            // Opcional: mostrar el nombre en el cuerpo del modal
            modalEliminar.querySelector('.modal-body').innerText =
                `¿Estás seguro de que deseas eliminar al usuario ${nombre}? Esta acción no se puede deshacer.`;
        });

        // 2. Ejecutar la eliminación (DELETE)
        document.getElementById('btnConfirmarEliminar').addEventListener('click', async () => {
            if (!idUsuarioAEliminar) return;

            try {
                const response = await fetch(`/admin/usuarios/${idUsuarioAEliminar}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    location.reload(); // Recarga la lista filtrada
                } else {
                    alert("Error al eliminar el usuario.");
                }
            } catch (error) {
                console.error("Error:", error);
            }
        });

        // 3. Lógica para Promover/Degradar (PUT)
        async function cambiarRol(id, accion) {
            // Tu endpoint es usuarios/${id}, asumimos que la API maneja la lógica según el rol actual
            const url = `/admin/usuarios/${id}`;

            try {
                const response = await fetch(url, {
                    method: 'PUT'
                });

                if (response.ok) {
                    location.reload();
                } else {
                    alert(`No se pudo ${accion} al usuario.`);
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }
    </script>
</html>
