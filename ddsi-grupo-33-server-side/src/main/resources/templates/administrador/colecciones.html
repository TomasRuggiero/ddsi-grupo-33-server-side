<!DOCTYPE html>
<html lang="es" th:replace="~{layout/base-admin ::html}">
<div th:fragment="contenido">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Gestión de Colecciones</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createCollectionModal">
                <i class="bi bi-plus-circle me-2"></i> Crear Nueva Colección
            </button>
        </div>
    </div>

    <div class="table-responsive d-none d-md-block">
        <table class="table table-striped table-sm">
            <thead>
            <tr>
                <th scope="col">#ID</th>
                <th scope="col">Nombre</th>
                <th scope="col">Descripción</th>
                <th scope="col">Algoritmo de Consenso</th>
                <th scope="col">Hechos</th>
                <th scope="col" class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="coleccion : ${colecciones}">
                <td th:text="${coleccion.id}"></td>
                <td th:text="${coleccion.titulo}"></td>
                <td class="text-truncate" style="max-width: 200px;" th:text="${coleccion.descripcion} + ."></td>
                <td><span class="badge bg-primary" th:text="${coleccion.algoritmoDeConsenso}"></span></td>
                <td th:text="${coleccion.hechos != null ? coleccion.hechos.size() : 0}"></td>
                <td class="text-center">
                    <button
                            type="button"
                            class="btn btn-sm btn-info me-1 text-white"
                            data-bs-toggle="modal"
                            data-bs-target="#editCollectionModal"
                            th:data-id="${coleccion.id}"
                            th:data-nombre="${coleccion.titulo}"
                            th:data-descripcion="${coleccion.descripcion}"
                            th:data-consenso="${coleccion.algoritmoDeConsenso}"
                            th:data-fuentes="${coleccion.idsFuentesDeDatos != null ? #strings.arrayJoin(coleccion.idsFuentesDeDatos, ',') : ''}"

                            th:data-categorias="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'Categoria'].empty ? '' : #strings.listJoin(coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'Categoria'][0].categorias, ', ')}"

                            th:data-fecha-desde="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaDeCarga'].empty ? '' : (#dates.format(coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaDeCarga'][0]?.fechaDesde, 'yyyy-MM-dd HH:mm') ?: '')}"

                            th:data-fecha-hasta="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaDeCarga'].empty ? '' : (#dates.format(coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaDeCarga'][0]?.fechaHasta, 'yyyy-MM-dd HH:mm') ?: '')}"

                            th:data-fecha-acon-desde="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaAcontecimiento'].empty ? '' : (#dates.format(coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaAcontecimiento'][0]?.fechaDesde, 'yyyy-MM-dd HH:mm') ?: '')}"

                            th:data-fecha-acon-hasta="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaAcontecimiento'].empty ? '' : (#dates.format(coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaAcontecimiento'][0]?.fechaHasta, 'yyyy-MM-dd HH:mm') ?: '')}"

                            th:data-lat="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'Ubicacion'].empty ? '' : coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'Ubicacion'][0].latitud}"

                            th:data-lng="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'Ubicacion'].empty ? '' : coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'Ubicacion'][0].longitud}"
                    >
                        <i class="bi bi-pencil-square"></i> Editar
                    </button>
                    <button
                            type="button"
                            class="btn btn-sm btn-danger"
                            data-bs-toggle="modal"
                            data-bs-target="#deleteCollectionModal"
                            th:data-id="${coleccion.id}"
                            th:data-nombre="${coleccion.titulo}"
                    >
                        <i class="bi bi-trash"></i> Eliminar
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="d-block d-md-none">
        <div class="card mb-3" th:each="coleccion : ${colecciones}">
            <div class="card-body">
                <h5 class="card-title fw-bold" th:text="${coleccion.titulo}"></h5>
                <p class="card-text">
                    <small class="fw-bold">ID:</small>
                    <small th:text="${coleccion.id}"></small>
                </p>
                <div class="mt-3">
                    <button
                            type="button"
                            class="btn btn-sm btn-info me-1 text-white"
                            data-bs-toggle="modal"
                            data-bs-target="#editCollectionModal"
                            th:data-id="${coleccion.id}"
                            th:data-nombre="${coleccion.titulo}"
                            th:data-descripcion="${coleccion.descripcion}"
                            th:data-consenso="${coleccion.algoritmoDeConsenso}"
                            th:data-fuentes="${coleccion.idsFuentesDeDatos != null ? #strings.arrayJoin(coleccion.idsFuentesDeDatos, ',') : ''}"

                            th:data-categorias="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'Categoria'].empty ? '' : #strings.listJoin(coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'Categoria'][0].categorias, ', ')}"

                            th:data-fecha-desde="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaDeCarga'].empty ? '' : (#dates.format(coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaDeCarga'][0]?.fechaDesde, 'yyyy-MM-dd HH:mm') ?: '')}"

                            th:data-fecha-hasta="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaDeCarga'].empty ? '' : (#dates.format(coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaDeCarga'][0]?.fechaHasta, 'yyyy-MM-dd HH:mm') ?: '')}"

                            th:data-fecha-acon-desde="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaAcontecimiento'].empty ? '' : (#dates.format(coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaAcontecimiento'][0]?.fechaDesde, 'yyyy-MM-dd HH:mm') ?: '')}"

                            th:data-fecha-acon-hasta="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaAcontecimiento'].empty ? '' : (#dates.format(coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'FechaAcontecimiento'][0]?.fechaHasta, 'yyyy-MM-dd HH:mm') ?: '')}"

                            th:data-lat="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'Ubicacion'].empty ? '' : coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'Ubicacion'][0].latitud}"

                            th:data-lng="${coleccion.criterioDePertenencia?.filtros == null || coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'Ubicacion'].empty ? '' : coleccion.criterioDePertenencia.filtros.?[tipoFiltro == 'Ubicacion'][0].longitud}"
                    >
                        <i class="bi bi-pencil-square"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="createCollectionModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Nueva Colección</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createCollectionForm">
                        <div class="row">
                            <div class="col-md-4 border-end">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Nombre</label>
                                    <input type="text" class="form-control" id="createName" required />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Descripción</label>
                                    <textarea class="form-control" id="createDescription" rows="4"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Algoritmo de Consenso</label>
                                    <select class="form-select" id="createConsensusAlgorithm">
                                        <option value="SIN_ALGORITMO">Sin Algoritmo</option>
                                        <option value="MAYORIA_SIMPLE">Mayoría simple</option>
                                        <option value="MAYORIA_ABSOLUTA">Mayoría absoluta</option>
                                        <option value="MULTIPLES_MENCIONES">Múltiples menciones</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label small fw-bold d-block">Seleccionar Fuentes de Datos</label>
                                <div class="row g-2">
                                    <div class="col-5">
                                        <select id="createAvailableFuentes" class="form-select" size="10" multiple>
                                            <option th:each="fuente : ${todasLasFuentes}" th:value="${fuente.id}" th:text="${fuente.nombre_archivo ?: fuente.tipo_fuente}"></option>
                                        </select>
                                    </div>
                                    <div class="col-2 text-center align-self-center">
                                        <button type="button" class="btn btn-sm btn-outline-primary w-100 mb-1" onclick="moveSelected('createAvailableFuentes', 'createSelectedFuentes')">Add <i class="bi bi-chevron-right"></i></button>
                                        <button type="button" class="btn btn-sm btn-outline-danger w-100" onclick="moveSelected('createSelectedFuentes', 'createAvailableFuentes')"><i class="bi bi-chevron-left"></i> Del</button>
                                    </div>
                                    <div class="col-5">
                                        <select id="createSelectedFuentes" class="form-select" size="10" multiple></select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div class="bg-light p-3 rounded">
                            <h6 class="mb-3 fw-bold"><i class="bi bi-filter-circle me-1"></i> Criterios de Pertenencia (Filtros)</h6>
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label class="small fw-bold text-muted">Fecha de Carga</label>
                                    <input type="datetime-local" class="form-control form-control-sm" id="createFechaDesde" title="Desde">
                                    <input type="datetime-local" class="form-control form-control-sm mt-1" id="createFechaHasta" title="Hasta">
                                </div>
                                <div class="col-md-3">
                                    <label class="small fw-bold text-muted">Fecha del Hecho</label>
                                    <input type="datetime-local" class="form-control form-control-sm" id="createFechaHechoDesde" title="Desde">
                                    <input type="datetime-local" class="form-control form-control-sm mt-1" id="createFechaHechoHasta" title="Hasta">
                                </div>
                                <div class="col-md-4">
                                    <label class="small fw-bold text-muted">Categorías (separadas por coma)</label>
                                    <textarea class="form-control form-control-sm" id="createCategorias" rows="3" placeholder="Ej: Ambiente, Incendio, Salud"></textarea>
                                </div>
                                <div class="col-md-2">
                                    <label class="small fw-bold text-muted">Ubicación</label>
                                    <input type="text" class="form-control form-control-sm mb-1" id="createLat" placeholder="Latitud">
                                    <input type="text" class="form-control form-control-sm" id="createLng" placeholder="Longitud">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary px-4" id="submitCreateBtn">Crear Colección</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editCollectionModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Colección</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editCollectionForm">
                        <div class="row">
                            <div class="col-md-4 border-end">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Nombre</label>
                                    <input type="text" class="form-control" id="editCollectionName" required />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Descripción</label>
                                    <textarea class="form-control" id="editCollectionDescription" rows="4"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Algoritmo</label>
                                    <select class="form-select" id="editConsensusAlgorithm">
                                        <option value="SIN_ALGORITMO">Sin Algoritmo</option>
                                        <option value="MAYORIA_SIMPLE">Mayoría simple</option>
                                        <option value="MAYORIA_ABSOLUTA">Mayoria absoluta</option>
                                        <option value="MULTIPLES_MENCIONES">Multiples menciones</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-8">
                                <div class="row g-2">
                                    <div class="col-5">
                                        <select id="availableFuentes" class="form-select" size="10" multiple>
                                            <option th:each="fuente : ${todasLasFuentes}" th:value="${fuente.id}" th:text="${fuente.nombre_archivo ?: fuente.tipo_fuente}"></option>
                                        </select>
                                    </div>
                                    <div class="col-2 text-center align-self-center">
                                        <button type="button" class="btn btn-sm btn-outline-primary w-100" onclick="moveSelected('availableFuentes', 'selectedFuentes')">Add</button>
                                        <button type="button" class="btn btn-sm btn-outline-danger w-100 mt-1" onclick="moveSelected('selectedFuentes', 'availableFuentes')">Del</button>
                                    </div>
                                    <div class="col-5">
                                        <select id="selectedFuentes" class="form-select" size="10" multiple></select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div class="bg-light p-3 rounded">
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label class="small fw-bold">Carga</label>
                                    <input type="datetime-local" class="form-control form-control-sm" id="editFechaDesde">
                                    <input type="datetime-local" class="form-control form-control-sm mt-1" id="editFechaHasta">
                                </div>
                                <div class="col-md-3">
                                    <label class="small fw-bold">Hecho</label>
                                    <input type="datetime-local" class="form-control form-control-sm" id="editFechaHechoDesde">
                                    <input type="datetime-local" class="form-control form-control-sm mt-1" id="editFechaHechoHasta">
                                </div>
                                <div class="col-md-4">
                                    <label class="small fw-bold">Categorías</label>
                                    <textarea class="form-control form-control-sm" id="editCategorias" rows="3"></textarea>
                                </div>
                                <div class="col-md-2">
                                    <label class="small fw-bold">Ubicación</label>
                                    <input type="text" class="form-control form-control-sm mb-1" id="editLat" placeholder="Lat">
                                    <input type="text" class="form-control form-control-sm" id="editLng" placeholder="Lng">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-info text-white" id="saveEditBtn">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteCollectionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Confirmar Eliminación</h5></div>
                <div class="modal-body">
                    <p>¿Eliminar <strong id="deleteNombreColeccion"></strong>?</p>
                    <input type="hidden" id="deleteCollectionId">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Sí, Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function moveSelected(fromId, toId) {
            const from = document.getElementById(fromId);
            const to = document.getElementById(toId);
            Array.from(from.selectedOptions).forEach(opt => { to.appendChild(opt); opt.selected = false; });
        }

        const editModal = document.getElementById('editCollectionModal');
        editModal.addEventListener('show.bs.modal', event => {
            const button = event.relatedTarget;
            const id = button.getAttribute('data-id');

            const formatForInput = (str) => (str && str.includes(' ')) ? str.replace(' ', 'T') : str;

            document.getElementById('editCollectionName').value = button.getAttribute('data-nombre');
            document.getElementById('editCollectionDescription').value = button.getAttribute('data-descripcion');
            document.getElementById('editCategorias').value = button.getAttribute('data-categorias');
            document.getElementById('editFechaDesde').value = formatForInput(button.getAttribute('data-fecha-desde'));
            document.getElementById('editFechaHasta').value = formatForInput(button.getAttribute('data-fecha-hasta'));
            document.getElementById('editFechaHechoDesde').value = formatForInput(button.getAttribute('data-fecha-acon-desde'));
            document.getElementById('editFechaHechoHasta').value = formatForInput(button.getAttribute('data-fecha-acon-hasta'));
            document.getElementById('editLat').value = button.getAttribute('data-lat');
            document.getElementById('editLng').value = button.getAttribute('data-lng');

            // Algoritmo
            const consenso = button.getAttribute('data-consenso');
            const sel = document.getElementById('editConsensusAlgorithm');
            for (let o of sel.options) { if(o.text.trim() === consenso.trim()) o.selected = true; }

            // Fuentes
            const av = document.getElementById('availableFuentes');
            const sd = document.getElementById('selectedFuentes');
            while(sd.options.length > 0) av.appendChild(sd.options[0]);
            const ids = (button.getAttribute('data-fuentes') || "").split(',').filter(x => x);
            Array.from(av.options).forEach(opt => { if(ids.includes(opt.value)) sd.appendChild(opt); });

            // Hidden ID
            let hid = document.getElementById('editCollectionId');
            if(!hid) {
                hid = document.createElement('input'); hid.type = 'hidden'; hid.id = 'editCollectionId';
                document.getElementById('editCollectionForm').appendChild(hid);
            }
            hid.value = id;
        });

        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            const id = document.getElementById('editCollectionId').value;
            const algo = document.getElementById('editConsensusAlgorithm').value;
            const data = {
                titulo: document.getElementById('editCollectionName').value,
                descripcion: document.getElementById('editCollectionDescription').value,
                fuentes_id: Array.from(document.getElementById('selectedFuentes').options).map(o => parseInt(o.value)),
                criterioDePertenencia: {
                    fecha_desde: document.getElementById('editFechaDesde').value || null,
                    fecha_hasta: document.getElementById('editFechaHasta').value || null,
                    fecha_acontecimiento_desde: document.getElementById('editFechaHechoDesde').value || null,
                    fecha_acontecimiento_hasta: document.getElementById('editFechaHechoHasta').value || null,
                    latitud: document.getElementById('editLat').value || null,
                    longitud: document.getElementById('editLng').value || null,
                    categorias: document.getElementById('editCategorias').value.split(',').map(s => s.trim()).filter(s => s)
                }
            };
            const res = await fetch(`/admin/colecciones/${id}?algoritmoDeConsenso=${algo}`, {
                method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
            });
            if(res.ok) window.location.reload();
        });

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            const id = document.getElementById('deleteCollectionId').value;
            const res = await fetch(`/admin/colecciones/${id}`, { method: 'DELETE' });
            if(res.ok) window.location.reload();
        });

        document.getElementById('submitCreateBtn').addEventListener('click', async () => {
            // Obtenemos el valor del select de algoritmo en el modal de creación
            const algo = document.getElementById('createConsensusAlgorithm').value;

            const data = {
                titulo: document.getElementById('createName').value,
                descripcion: document.getElementById('createDescription').value,
                fuentes_id: Array.from(document.getElementById('createSelectedFuentes').options)
                    .map(o => parseInt(o.value)),
                criterioDePertenencia: {
                    // Asegúrate de que los IDs coincidan con los nombres de los inputs del modal
                    fechaDesde: document.getElementById('createFechaDesde').value || null,
                    fechaHasta: document.getElementById('createFechaHasta').value || null,
                    fechaAcontecimientoDesde: document.getElementById('createFechaHechoDesde').value || null,
                    fechaAcontecimientoHasta: document.getElementById('createFechaHechoHasta').value || null,
                    latitud: document.getElementById('createLat').value || null,
                    longitud: document.getElementById('createLng').value || null,
                    categorias: document.getElementById('createCategorias').value
                        .split(',')
                        .map(s => s.trim())
                        .filter(s => s)
                }
            };

            // Enviamos el POST al controlador del Front (8081)
            const res = await fetch(`/admin/colecciones?algoritmoDeConsenso=${algo}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                window.location.reload();
            } else {
                alert("Error al crear la colección.");
            }
        });

        // Agregar esto junto a la lógica del editModal
        const deleteModal = document.getElementById('deleteCollectionModal');
        deleteModal.addEventListener('show.bs.modal', event => {
            const button = event.relatedTarget; // Botón que activó el modal
            const id = button.getAttribute('data-id');
            const nombre = button.getAttribute('data-nombre');

            // Seteamos los valores en el modal
            document.getElementById('deleteNombreColeccion').textContent = nombre;
            document.getElementById('deleteCollectionId').value = id;
        });
    </script>
</div>
</html>
