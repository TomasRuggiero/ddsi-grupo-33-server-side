<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="'MetaMapa | ' + ${coleccion.titulo}">MetaMapa</title>
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
  />
  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="/css/custom.css" />
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">MetaMapa</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/admin">Administrador</a></li>
        <li class="nav-item"><a class="nav-link" href="/visualizador/colecciones">Colecciones</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{'/hechos/nuevo'}">Subir Hecho</a></li>
        <li class="nav-item"><a class="nav-link" href="/login">Iniciar Sesión</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="flex-grow-1">

  <div class="bg-light py-3 border-bottom">
    <div class="container d-flex justify-content-center">
      <div class="btn-group" role="group" aria-label="Modo de navegación">
        <input type="radio" class="btn-check" name="modo_nav" id="modoCurada" value="true"
               th:checked="${param.curado != null and param.curado[0] == 'true'}" autocomplete="off" />
        <label class="btn btn-outline-primary" for="modoCurada">Curada</label>

        <input type="radio" class="btn-check" name="modo_nav" id="modoIrrestricta" value="false"
               th:checked="${param.curado == null or param.curado[0] == 'false'}" autocomplete="off" />
        <label class="btn btn-outline-secondary" for="modoIrrestricta">Irrestricta</label>
      </div>
    </div>
  </div>


  <div class="container my-5">
    <h1 class="mb-2" th:text="${coleccion.titulo}">Título de la colección</h1>

    <div class="mb-4">
      <span class="text-muted fw-bold small text-uppercase">Algoritmo de consenso:</span>
      <span class="badge bg-light text-dark border shadow-sm ms-1 px-3 py-2" style="font-size: 0.9rem;">
            <i th:class="${coleccion.algoritmoDeConsenso == 'SIN_ALGORITMO' ? 'bi bi-cpu-fill text-danger me-1' : 'bi bi-cpu text-primary me-1'}"></i>

            <span th:text="${coleccion.algoritmoDeConsenso}">
                Nombre del Algoritmo
            </span>
        </span>
    </div>

    <p class="mb-4 text-muted" th:text="${coleccion.descripcion}">Descripción de la colección</p>

    <div class="accordion mb-4" id="filtersAccordion">
      <div class="accordion-item">
        <h2 class="accordion-header" id="filtersHeading">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#filtersCollapse">
            <i class="bi bi-funnel me-2"></i> Filtros de búsqueda
          </button>
        </h2>
        <div id="filtersCollapse" class="accordion-collapse collapse" data-bs-parent="#filtersAccordion">
          <div class="accordion-body">
            <form class="row g-3" id="formFiltros" th:action="@{'/visualizador/colecciones/' + ${coleccion.id}}" method="get">

              <input type="hidden" name="curado" id="curadoHidden" th:value="${param.curado ?: 'false'}" />

              <div class="col-md-6 col-lg-4">
                <label for="titulo" class="form-label">Título del hecho</label>
                <input type="text" class="form-control" id="titulo" name="titulo" th:value="${param.titulo}" />
              </div>

              <div class="col-md-6 col-lg-4">
                <label for="categoria" class="form-label">Categoría</label>
                <input type="text" class="form-control" id="categoria" name="categoria" th:value="${param.categoria}" />
              </div>

              <div class="col-12 border-bottom my-3"></div>

              <div class="col-md-6 col-lg-3">
                <label for="fecha_desde" class="form-label">Fecha Registro (Desde)</label>
                <input type="date" class="form-control" id="fecha_desde" name="fecha_desde" th:value="${param.fecha_desde}" />
              </div>
              <div class="col-md-6 col-lg-3">
                <label for="fecha_hasta" class="form-label">Fecha Registro (Hasta)</label>
                <input type="date" class="form-control" id="fecha_hasta" name="fecha_hasta" th:value="${param.fecha_hasta}" />
              </div>

              <div class="col-md-6 col-lg-3">
                <label for="latitud" class="form-label">Latitud</label>
                <input type="text" class="form-control" id="latitud" name="latitud" th:value="${param.latitud}" />
              </div>
              <div class="col-md-6 col-lg-3">
                <label for="longitud" class="form-label">Longitud</label>
                <input type="text" class="form-control" id="longitud" name="longitud" th:value="${param.longitud}" />
              </div>

              <div class="col-12 d-flex justify-content-end">
                <button type="submit" class="btn btn-primary me-2"><i class="bi bi-search"></i> Buscar</button>
                <a th:href="@{'/visualizador/colecciones/' + ${coleccion.id} + '?curado=false'}" class="btn btn-outline-secondary">Limpiar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="table-responsive d-none d-md-block">
      <table class="table table-striped">
        <thead>
        <tr>
          <th>Título</th>
          <th>Fecha</th>
          <th>Ubicación</th>
          <th>Fuente</th>
          <th>Categoría</th>
          <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="hecho : ${coleccion.hechos}">
          <td th:text="${hecho.titulo}"></td>
          <td th:text="${#temporals.format(hecho.fecha_acontecimiento, 'dd/MM/yyyy')}"></td>
          <td th:text="${hecho.ubicacion != null ? hecho.ubicacion.direccion : 'N/A'}"></td>
          <td th:text="${hecho.origen}"></td>
          <td th:text="${hecho.categorias}"></td>
          <td>
            <a th:href="@{/visualizador/hecho/{id}(id=${hecho.id})}" class="btn btn-sm btn-primary"><i class="bi bi-eye"></i></a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="d-block d-md-none">
      <div class="row g-3" th:each="hecho : ${coleccion.hechos}">
        <div class="col-12">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title fw-bold" th:text="${hecho.titulo}"></h5>
              <p class="card-text mb-1 small"><strong>Ubicación:</strong> <span th:text="${hecho.ubicacion?.direccion}"></span></p>
              <a th:href="@{/visualizador/hecho/{id}(id=${hecho.id})}" class="btn btn-sm btn-primary">Ver Hecho</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="bg-dark text-white-50 py-4 mt-5">
  <div class="container text-center">
    <p class="mb-0 small">© 2025 MetaMapa.</p>
  </div>
</footer>

<script>
  const radios = document.querySelectorAll('input[name="modo_nav"]');
  const hiddenCurado = document.getElementById('curadoHidden');
  const form = document.getElementById('formFiltros');

  // Cada vez que cambia el radio button, se actualiza el hidden y se envía el form
  radios.forEach(radio => {
    radio.addEventListener('change', () => {
      hiddenCurado.value = radio.value;
      form.submit();
    });
  });

  form.addEventListener('submit', function(e) {
    const fDesde = document.getElementById('fecha_desde').value;
    const fHasta = document.getElementById('fecha_hasta').value;
    const lat = document.getElementById('latitud').value;
    const lon = document.getElementById('longitud').value;

    let errores = [];
    if ((fDesde && !fHasta) || (!fDesde && fHasta)) errores.push("Completa ambos campos de fecha registro.");
    if ((lat && !lon) || (!lat && lon)) errores.push("Completa Latitud y Longitud.");

    if (errores.length > 0) {
      alert(errores.join("\n"));
      e.preventDefault();
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
