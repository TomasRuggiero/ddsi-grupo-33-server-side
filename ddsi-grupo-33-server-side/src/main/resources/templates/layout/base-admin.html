<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="'MetaMapa | ' + ${titulo}"></title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
    />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
</head>

<body>
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin">Administrador</a>
            <button
                    class="navbar-toggler d-md-none"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#sidebarOffcanvas"
                    aria-controls="sidebarOffcanvas"
                    aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <ul class="navbar-nav ms-auto d-flex flex-row align-items-center">
                <li sec:authorize="isAuthenticated()" class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="nav-link border-0 bg-transparent" type="submit">
                            Cerrar sesión <i class="bi bi-box-arrow-right ms-1"></i>
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row flex-nowrap">
            <div
                    class="col-xl-2 col-3 bg-dark vh-100 top-0 start-0 d-md-block d-none"
            >
                <div class="d-flex flex-column flex-shrink-0 p-3 pt-5 text-white-50">
                    <ul class="nav nav-pills flex-column mb-auto mt-4">
                        <li class="nav-item mb-2">
                            <a href="/" class="nav-link text-white">
                                <i class="bi bi-house-fill me-2"></i> Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/admin"
                               class="nav-link text-white"
                               th:classappend="${menu == 'admin'} ? ' active' : ''"
                            >
                                <i class="bi bi-grid-fill me-2"></i> Resumen
                            </a>
                        </li>
                        <hr />
                        <li>
                            <a href="/admin/hechos"
                               class="nav-link text-white"
                               th:classappend="${menu == 'hechos'} ? ' active' : ''"
                            >
                                <i class="bi bi-geo-alt-fill me-2"></i> Hechos
                            </a>
                        </li>
                        <li>
                            <a href="/admin/colecciones"
                               class="nav-link text-white"
                               th:classappend="${menu == 'colecciones'} ? ' active' : ''"
                            >
                                <i class="bi bi-folder-fill me-2"></i> Colecciones
                            </a>
                        </li>
                        <li>
                            <a href="/admin/solicitudes"
                               class="nav-link text-white"
                               th:classappend="${menu == 'solicitudes'} ? ' active' : ''"
                            >
                                <i class="bi bi-envelope-fill me-2"></i> Solicitudes
                            </a>
                        </li>
                        <li>
                            <a
                                    href="/admin/fuentes"
                                    class="nav-link text-white"
                                    th:classappend="${menu == 'fuentes'} ? ' active' : ''"
                            >
                                <i class="bi bi-database-fill me-2"></i> Fuentes
                            </a>
                        </li>
                        <li>
                            <a
                                    href="/admin/usuarios"
                                    class="nav-link text-white"
                                    th:classappend="${menu == 'usuarios'} ? ' active' : ''"
                                    aria-current="page"
                            >
                                <i class="bi bi-people-fill me-2"></i> Usuarios
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <div
                    class="offcanvas offcanvas-start bg-dark text-white"
                    tabindex="-1"
                    id="sidebarOffcanvas"
                    aria-labelledby="sidebarOffcanvasLabel"
            >
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="sidebarOffcanvasLabel">Menú</h5>
                    <button
                            type="button"
                            class="btn-close text-reset"
                            data-bs-dismiss="offcanvas"
                            aria-label="Close"
                    ></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="nav nav-pills flex-column mb-auto">
                        <li class="nav-item mb-2">
                            <a href="/" class="nav-link text-white">
                                <i class="bi bi-house-fill me-2"></i> Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/admin" class="nav-link text-white">
                                <i class="bi bi-grid-fill me-2"></i> Resumen
                            </a>
                        </li>
                        <hr />
                        <li>
                            <a href="/admin/hechos" class="nav-link text-white">
                                <i class="bi bi-geo-alt-fill me-2"></i> Hechos
                            </a>
                        </li>
                        <li>
                            <a href="/admin/colecciones" class="nav-link text-white">
                                <i class="bi bi-folder-fill me-2"></i> Colecciones
                            </a>
                        </li>
                        <li>
                            <a href="/admin/solicitudes" class="nav-link text-white">
                                <i class="bi bi-envelope-fill me-2"></i> Solicitudes
                            </a>
                        </li>
                        <li>
                            <a
                                    href="/admin/fuentes"
                                    class="nav-link text-white"
                            >
                                <i class="bi bi-database-fill me-2"></i> Fuentes
                            </a>
                        </li>
                        <li>
                            <a
                                    href="/admin/usuarios"
                                    class="nav-link text-white"
                            >
                                <i class="bi bi-people-fill me-2"></i> Usuarios
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <main class="col-12 col-md-9 col-xl-10 px-md-4 pt-5">
                <div th:replace="~{${contenido} :: contenido}"></div>
            </main>
        </div>
    </div>


    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>
</html>
